# Roadmap legible por máquina — arquitectura v3 §15
#
# El §6 dice que el campo `estado` de cada servicio "hace verificable el roadmap por máquina".
# Este archivo es la otra mitad: la lista completa de los 33 agentes y los 31 servicios con su
# fase declarada, exista o no todavía su archivo en registry/.
#
# Para qué sirve, en concreto: sin esto, en cuanto registry/agents/ deja de estar vacío el
# validador empieza a exigir que TODO owner_digital apunte a un archivo real, y 30 equipos
# fallarían por señalar agentes que el roadmap todavía no construye. Con esto, la diferencia
# entre "no existe porque falta" y "no existe porque su fase no llegó" es explícita y verificable.
#
# Regla: un ID que no esté aquí no puede aparecer en ningún registro. Si hace falta un agente
# nuevo, primero entra al roadmap.

version: 3.0.1
fuente: docs/arquitectura-v3.md §15
total_agentes: 33      # 32 de dominio + O1
total_servicios: 31

# Excepción declarada: los consultores C-01…C-09 no tienen fase (§5-bis.3, regla 6).
# "No hay fase de roadmap que los encienda; existen desde que el registro los declara."
# Por eso viven en registry/consultants/ y no aparecen en esta lista.

