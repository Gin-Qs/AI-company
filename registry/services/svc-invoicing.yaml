id: svc-invoicing
name: Emisión y Timbrado
type: deterministic_python
estado: planned
fase: 2
owner_domain: [02-finanzas]
modulo: services/invoicing       # se crea al construir la fase

# El hueco más caro de la v1: la operación cerraba viajes y el ingreso se facturaba a mano.
# Arma el comprobante a partir del viaje cerrado y su expediente; el timbrado con el PAC es
# la frontera con el mundo real y por eso es ACT-DOC-S, HITL siempre (§11.4).
consumidores: [D2-04, D2-06, svc-ar]

inputs:
  - trip_id
  - cliente_id
  - conceptos                  # flete, demoras, estadías, maniobras
  - expediente_completo        # de svc-doc-checklist: sin esto no arma nada
  - tarifa_aplicada
  - datos_fiscales_cliente
outputs:
  - borrador_de_comprobante
  - conceptos_facturables
  - total_y_desglose
  - folio_y_serie
  - resultado_de_timbrado

tests:
  - test_no_factura_viaje_con_expediente_incompleto
  - test_demoras_y_estadias_entran_como_concepto
  - test_total_cuadra_con_la_tarifa_aplicada
  - test_timbrado_es_hitl_siempre
  - test_folio_no_se_reutiliza
  - test_viaje_ya_facturado_no_se_factura_dos_veces

controls: [CTL-HITL, CTL-AUDIT, CTL-LIMIT]
limits:
  - no_timbra_sin_autorizacion_humana
  - no_modifica_montos_pactados
  - no_factura_sin_expediente_completo
  - no_reutiliza_folio
version: v0.1.0-contrato

decisiones_pendientes:
  - "Qué PAC usa Fleeter y con qué credenciales; si el timbrado entra por API o queda fuera
     del sistema en la Fase 2 (emitir el borrador ya es la mayor parte del ahorro)"
  - "Catálogo de conceptos, series y folios vigentes — dato maestro, entra por svc-masterdata"
  - "Cómo se cobran demoras y estadías hoy: tarifa por hora, por día, o negociada por cliente"
