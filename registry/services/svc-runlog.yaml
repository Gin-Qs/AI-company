id: svc-runlog
name: Registro del Camino y el Progreso
type: deterministic_python
estado: built
fase: 1
owner_domain: [05-tecnologia-datos, 01-direccion]
modulo: services/runlog

# El hueco mas grande de la v1 y la v2. R7: si no esta en la bitacora, no ocurrio.
# Append-only e inmutable: los casos se reconstruyen plegando eventos, no actualizando filas.
consumidores: [svc-budget, svc-validation, D5-03, D6-04, O1, D4-03, D2-03]

inputs:
  - trace_id
  - actor
  - tipo_paso
  - entradas
  - salidas
  - versiones
  - tokens
  - costo
  - gate
outputs:
  - caso
  - progreso
  - pasos
  - vencimientos
  - consumo_por_actor
  - reintentos_por_actor

tests:
  - test_caso_recorre_la_maquina_de_estados
  - test_transicion_invalida_se_rechaza_runlog
  - test_maximo_dos_reintentos
  - test_registro_es_append_only
  - test_progreso_responde_sin_llm
  - test_consumo_por_actor_alimenta_budget
  - test_sla_alta_en_horas_habiles
  - test_hitl_vencido_escala_nunca_aprueba
  - test_criticidad_baja_expira
  - test_calendario_corre_en_hora_local

controls: [CTL-AUDIT, CTL-PRIVACY]
limits:
  - no_reescribe_eventos
  - no_auto_aprueba_un_hitl_vencido
  - no_guarda_pii_sin_redactar
version: v1.0.0
