id: D3-05
name: Evidencias y Cierre de Viaje
department: 03-operaciones-logisticas
teams:
  - T03-06
mission: >
  Cerrar el viaje con su expediente completo: qué documento falta, a quién se le pide y desde
  cuándo está pendiente. No decide si el expediente está completo —eso lo dicta
  svc-doc-checklist— y no factura: entrega el viaje listo para que D2-04 lo facture.

# `planned`: la Fase 2 no ha empezado. El contrato existe desde ahora porque preparar una fase
# es escribir qué va a hacer cada pieza antes de construirla, no después.
estado: planned
fase: 2
model_tier: Medio
absorbe: [A30, A31, A32]

condiciones_encendido:
  - condicion: "svc-doc-checklist construido y en verde"
    responsable: D5-01
    cumplida: false
  - condicion: "Catálogo de requisitos documentales por tipo de servicio, cargado en svc-masterdata"
    responsable: Elias
    decide: Gabriel
    cumplida: false
  - condicion: "Bandeja única de HITL del ERP en producción con los SLA de §7.3"
    responsable: D5-01
    cumplida: false

invocable_por: [Gabriel, Elias, O1]

tools:
  - svc-doc-checklist
  - svc-validation
  - svc-trace
  - svc-runlog
  - svc-budget
tools_planeadas:
  - svc-notify          # fase 2: para pedir el documento faltante con plantilla fija
  - svc-telemetry       # fase 5: evidencia de llegada y tiempos de estadía

inputs: [viaje_cerrado, documento_recibido, incidencia_de_ruta, tipo_de_servicio]
outputs: [expediente_de_viaje, faltante_documental, viaje_listo_para_facturar, aviso_a_operador]

# Cero ACT-* en la Fase 2: pedir un documento faltante sale por plantilla fija de svc-notify,
# que no es texto libre. Si algún día redacta el mensaje, necesita ACT-EMAIL-S con HITL.
actions: []
controls:
  - CTL-AUDIT
  - CTL-POLICY

limits:
  - no_factura                          # §4.1: es de D2-04, y sólo con expediente completo
  - no_libera_cierre_con_faltantes
  - no_modifica_evidencia
  - no_declara_completo_lo_que_el_checklist_marca_incompleto

prompt_version: v0.1.0-contrato
