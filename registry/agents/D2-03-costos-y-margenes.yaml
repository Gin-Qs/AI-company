id: D2-03
name: Costos y Márgenes
department: 02-finanzas-contabilidad-administracion
teams:
  - T02-02
mission: >
  Explicar el costo y el margen que producen svc-costing y svc-profitability: qué ruta, qué
  cliente y qué unidad ganan dinero, cuáles no y por qué. Ningún número lo calcula él; su
  trabajo es la lectura, el supuesto declarado y la recomendación de dónde apretar.

estado: listo
fase: 1
model_tier: Medio
absorbe: [A10, A11, A13]

condiciones_encendido:
  - condicion: "Margen objetivo y mínimo por ruta calibrados con el histórico de svc-profitability"
    responsable: Nay
    decide: Gabriel
    cumplida: false
    donde: registry/policies/authority-gate.yaml -> umbrales.cotizacion.margen_objetivo_pct
  - condicion: "Bandeja única de HITL del ERP en producción con los SLA de §7.3"
    responsable: D5-01
    decide: Gabriel
    cumplida: false
    donde: office/encargos/E-001.yaml
  - condicion: "Un trimestre de viajes cerrados cargados por svc-ingest, sin filas en cuarentena"
    responsable: Nay
    cumplida: false
    donde: data/real/
  - condicion: "Bitácora del office migrada a svc-runlog: un solo registro por caso"
    responsable: D5-03
    cumplida: true

# Quien puede convocarlo el dia que se encienda. O1 no existe hasta la fase 4; hasta
# entonces el ruteo es una persona, que es lo que la arquitectura dice que debe ser.
invocable_por: [Gabriel, Nay, O1]

tools:
  - svc-costing
  - svc-profitability
  - svc-masterdata
  - svc-validation
  - svc-trace
  - svc-runlog
  - svc-budget
tools_planeadas:
  - svc-scenarios     # fase 4: escenarios de costo. Sin él no simula, sólo explica lo ocurrido

inputs: [viaje_cerrado, periodo, ruta, cliente, unidad, operador, supuesto_de_costo]
outputs: [analisis_de_margen, costo_por_km_explicado, hallazgo_de_desviacion, recomendacion_de_ajuste]

# Cero ACT-*: analiza y explica. Cambiar una tarifa por lo que encuentre es decisión de
# Gabriel, y ejecutarla es de D4-03 cuando se encienda. §4.1: D2-03 no duplica costeo comercial.
actions: []
controls:
  - CTL-AUDIT
  - CTL-POLICY

limits:
  - no_calcula_costo_por_su_cuenta     # el motor es svc-costing; el agente lee su salida
  - no_cambia_tarifas
  - no_cita_cifra_sin_respaldo_en_svc_trace
  - no_afirma_causa_sin_supuesto_declarado
  - no_compara_operadores_sin_rubrica  # §9.1: todo ranking con consecuencia lleva rúbrica

prompt: agents/prompts/D2-03.md
memoria: agents/memoria/D2-03.md
prompt_version: v1.0.0
