[project]
name = "ai-company"
version = "0.1.0"
description = "Oficina Virtual de Agentes IA - capa deterministica y capa de agentes"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# El driver de Postgres es opcional a proposito. Solo lo necesita
# scripts/migrar_a_postgres.py cuando de verdad escribe; con --simular y --sql el script
# corre sin el, y la suite entera se prueba sin base de datos. Meterlo en `dependencies`
# obligaria a instalar y compilar un driver a quien solo quiere correr `services.cli`.
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["services*", "agents*", "office*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
