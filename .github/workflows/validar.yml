# Validacion del repositorio (docs/portal.md §11).
#
# Hasta hoy todo esto corria a mano, en la maquina de quien programaba. Un YAML mal
# escrito podia llegar a main sin que nadie corriera las 16 reglas, y con Vercel
# desplegando desde main eso significa: llegar a produccion.
#
# Tres cosas se comprueban, y las tres pueden reprobar el PR:
#
#   1. La suite de pruebas.
#   2. Las 16 reglas del registro.
#   3. Que los vectores dorados del SLA sigan describiendo lo que sla.py hace hoy.
#
# La tercera es la menos obvia y la que mas protege: el portal reimplementa el
# calendario laboral en TypeScript, y una reimplementacion que nadie contrasta
# diverge en silencio. Un SLA que se corre media hora no truena — aprueba tarde y
# parece que funciono.

name: validar

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pruebas y registro
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # pyproject.toml declara requires-python >=3.11
          cache: pip

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      # `--junitxml` no es decoracion: la fila de `validacion_registro` lleva `pytest_ok` y
      # `pytest_total`, y los dos salen de ese archivo. Un "en verde" que no dice cuantas
      # pruebas corrieron se ve igual con 290 pruebas que con ninguna.
      - name: Pruebas
        run: python -m pytest --junitxml=pytest.xml

      # --verbose lista las reglas omitidas con su motivo. Una regla omitida no es una
      # regla en verde y el log tiene que dejar ver la diferencia.
      - name: Reglas del registro
        run: python scripts/validate_registry.py --verbose --json validacion.json

      # Si sla.py cambia y los vectores no se regeneran, el contrato con el puerto de
      # TypeScript deja de valer sin que nadie se entere. Aqui se entera.
      - name: Los vectores del SLA siguen al dia
        run: |
          python scripts/vectores_sla.py
          git diff --exit-code -- tests/fixtures/sla-vectores.json \
            || { echo "::error::tests/fixtures/sla-vectores.json quedo desfasado de services/runlog/sla.py. Corre 'python scripts/vectores_sla.py' y agrega el resultado al commit."; exit 1; }

      # Mismo guardian que los vectores del SLA, y por la misma razon: el portal
      # reimplementa las reglas de convocatoria en TypeScript, y una reimplementacion que
      # nadie contrasta diverge en silencio. El modo de fallo aqui no es un error visible,
      # es que el portal deje convocar a un agente que el CLI habria rechazado.
      - name: Los vectores de convocatoria siguen al dia
        run: |
          python scripts/vectores_convocatoria.py
          git diff --exit-code -- tests/fixtures/convocatoria-vectores.json \
            || { echo "::error::tests/fixtures/convocatoria-vectores.json quedo desfasado de agents/runtime.py. Corre 'python scripts/vectores_convocatoria.py' y agrega el resultado al commit."; exit 1; }

      # LA TERCERA COSA QUE PIDE §11: escribir el resultado a `validacion_registro`.
      #
      # El portal lee la ultima fila de esta tabla para pintar la vista 7 sin reimplementar
      # ninguna de las 16 reglas. Cero duplicacion, cero deriva posible.
      #
      # `if: always()` a proposito: la corrida que MAS importa publicar es la que fallo. Si
      # solo se publicaran las verdes, el portal ensenaria salud perfecta justo cuando el
      # registro esta roto.
      #
      # Sin el secreto DIRECT_URL el script avisa y sale en 0 — un PR de quien no tiene
      # acceso a la base no se reprueba por eso, pero el aviso queda en el log y la vista
      # sigue mostrando la fecha de la ultima corrida que si se publico.
      - name: Publicar la salud del registro
        if: always()
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python -m pip install "psycopg[binary]>=3.2"
          python scripts/publicar_validacion.py validacion.json --pytest-xml pytest.xml

      # Y ademas como artefacto descargable: si el secreto no esta puesto, esto sigue siendo
      # la unica copia del resultado.
      - name: Guardar el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacion-registro
          path: validacion.json
          if-no-files-found: warn

  web:
    name: puerto de reglas a TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      # Corre con TZ=UTC (vitest.config.ts) contra los vectores generados desde el
      # Python. Es lo unico que impide que las dos implementaciones del calendario
      # laboral se separen sin que nadie lo note.
      - name: Contrato del calendario laboral
        run: npm test
